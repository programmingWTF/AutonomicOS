name: build

# 可复现构建是本项目唯一能给出的信用替代品（CHARTER §1.4）。
# 这个 workflow 干三件事：构建、验证"再编一次还是同一个包"、把仓库发成静态站点。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential dpkg-dev debhelper fakeroot apt-utils gnupg

      - name: Build the .deb
        run: ./build/build.sh

      # 在编译产物之前先跑纯逻辑自检：它 1 秒内跑完，却能挡住
      # "计划校验放松了"这类最贵的回归 —— 那是整条 AI 通道的入口过滤器。
      - name: Planner self-check (parse + validation)
        run: python3 scripts/test-plan.py

      # 原语的参数校验是"执行别人代码"（pkg.install 的 postinst 以 root 跑）
      # 之前的最后一关，值得同样钉在 CI 上。
      - name: Primitives self-check (pkg.* / user.* guards)
        run: python3 scripts/test-primitives.py

      # 感知层（M9）的自检。它钉的不是"读到的值对不对"（每台机器不一样），
      # 而是三件更安静的事：有没有绕过通道自己读、取不到时有没有悄悄少写
      # 一行、只读有没有被算成"改了世界"。
      - name: Sense self-check (channel-only reads, honest gaps)
        run: python3 scripts/test-sense.py

      # M10：感知喂回模型之后，最容易坏的不是"喂没喂"，而是模型看到的
      # 快照和磁盘上存的那份不是同一份、感知被写成了指令、上下文没有上限。
      - name: Ask-context self-check (one snapshot, bounded, not an instruction)
        run: python3 scripts/test-ask-context.py

      # 备份命名与可还原性（sidecar 不许猜文件名）。它跨两种路径形状，
      # 所以也是"可写边界在沙箱参照物下也成立"的那道保险。
      - name: Backup naming self-check
        run: python3 scripts/test-backup-naming.py packaging/autonomic-agent/src

      - name: Reproducibility check -- build twice, must be byte-identical
        run: |
          a=$(sha256sum dist/*.deb | awk '{print $1}')
          ./build/build.sh
          b=$(sha256sum dist/*.deb | awk '{print $1}')
          echo "first : $a"
          echo "second: $b"
          if [ "$a" != "$b" ]; then
            echo "::error::not reproducible -- the same tree produced two different .deb files"
            exit 1
          fi
          echo "reproducible"

      - name: Build the signed apt repository
        env:
          AUTONOMIC_GPG_PRIVATE_KEY: ${{ secrets.AUTONOMIC_GPG_PRIVATE_KEY }}
        run: |
          # 没有密钥时用 make-repo.sh 自己生成的开发密钥签名，
          # 产物依然可用，只是不该被当作发布物信任。
          if [ -n "$AUTONOMIC_GPG_PRIVATE_KEY" ]; then
            printf '%s' "$AUTONOMIC_GPG_PRIVATE_KEY" | gpg --batch --import
          fi
          ./repo/make-repo.sh

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: apt-repo
          path: repo/out/

  # 仓库是纯静态目录 —— 任何静态托管都能当 apt 源。
  # 需要在仓库设置里把 Pages 的 source 改成 "GitHub Actions"。
  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apt-repo
          path: repo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: repo
      - id: deployment
        uses: actions/deploy-pages@v4
